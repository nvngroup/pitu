name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de release'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
      dry_run:
        description: 'Dry run (apenas simular, não executar)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

permissions: write-all

jobs:
  update-version-badges:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x

      - name: Update version badges
        run: |
          npm run update:version-badges

      - name: Commit badge updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout dev
          git add README.md README-en.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update version badges to $(node -p "require('./package.json').version")"
            git push origin dev
          else
            echo "No changes to commit"
          fi

  publish-npmjs:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [update-version-badges]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetching tags
        run: git fetch --tags -f || true

      - name: Setup Node for npmjs
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Configure NPM with Granular Token
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Verify NPM Authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn

      - name: Make Package
        run: npm pack

      - name: Rename Pack for npmjs
        run: mv *.tgz nvngroup-baileys-npmjs.tgz

      - name: Publish to npmjs
        continue-on-error: true
        run: npm publish nvngroup-baileys-npmjs.tgz --access public

  publish-github-packages:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [update-version-badges]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetching tags
        run: git fetch --tags -f || true

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x
          registry-url: "https://npm.pkg.github.com"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path-github
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        id: yarn-cache-github
        with:
          path: ${{ steps.yarn-cache-dir-path-github.outputs.dir }}
          key: ${{ runner.os }}-yarn-github-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-github-

      - name: Install Dependencies
        run: yarn
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Package
        run: npm pack

      - name: Rename Pack for GitHub
        run: mv *.tgz nvngroup-baileys-github.tgz

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: npm publish nvngroup-baileys-github.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-github-release:
    runs-on: ubuntu-latest
    needs: [publish-npmjs, publish-github-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 20.x

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.previous_tag.outputs.tag }}" ]; then
            CHANGELOG=$(git log ${{ steps.previous_tag.outputs.tag }}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Escape newlines for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      - name: Build package for release
        run: |
          yarn
          npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 📦 Release ${{ steps.version.outputs.version }}

            ### 📝 Changes
            ${{ steps.changelog.outputs.changelog }}

            ### 📥 Installation

            **NPM:**
            ```bash
            npm install @nvngroup/baileys@${{ steps.version.outputs.version }}
            ```

            **Yarn:**
            ```bash
            yarn add @nvngroup/baileys@${{ steps.version.outputs.version }}
            ```

            **GitHub Packages:**
            ```bash
            npm install @nvngroup/baileys@${{ steps.version.outputs.version }} --registry=https://npm.pkg.github.com
            ```

            ---

            📚 [Documentation](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md) | 🐛 [Report Issues](https://github.com/${{ github.repository }}/issues)
          files: |
            *.tgz
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
